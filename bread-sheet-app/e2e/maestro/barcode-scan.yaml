# Native Android smoke flow for the camera/barcode path.
# Run with: npm run test:maestro
# Headless emulators cannot receive camera frames from Maestro, so the debug
# build exposes a "Use test barcode" fixture (EXPO_PUBLIC_MAESTRO_BARCODE) that
# drives the exact same expo-camera barcode callback deterministically.
appId: com.breadsheetexpo.breadsheet
---
- launchApp:
    clearState: true
# A debug build fetches its JS bundle from Metro on every cold start, so after a
# fresh install the first frame can take a while (the runner pre-warms the bundle
# and keeps Metro alive, but a slow CI box can still exceed a bare tapOn's wait).
# Wait for the login screen before tapping into it.
- extendedWaitUntil:
    visible: "Continue as Guest"
    timeout: 60000
- tapOn: "Continue as Guest"
- extendedWaitUntil:
    visible: "Scan"
    timeout: 15000
- tapOn: "Scan"
- tapOn: "Allow Camera"
# Android's runtime permission dialog is separate from the app's permission
# button. `optional` keeps this compatible with an AVD that retained a grant.
- tapOn:
    text: "While using the app"
    optional: true
- extendedWaitUntil:
    visible: "Align barcode within the frame"
    timeout: 10000
# Headless AVDs cannot receive camera frames from Maestro. The debug build's
# fixture button invokes the same expo-camera callback deterministically.
- tapOn: "Use test barcode"
# Keep this assertion after the barcode callback. It proves that a valid code
# was accepted and that the scan handler navigated to the product route.
- extendedWaitUntil:
    visible: "Product"
    timeout: 30000
