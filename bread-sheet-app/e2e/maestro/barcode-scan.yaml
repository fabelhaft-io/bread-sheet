# Native Android smoke flow for the camera/barcode path.
# Run with: npm run test:maestro
# The emulator camera must be pointed at a screen or card showing an EAN-13
# barcode. Maestro cannot synthesize a camera frame; the runner script starts
# the configured emulator and leaves the camera available for this flow.
appId: com.breadsheetexpo.breadsheet
---
- launchApp:
    clearState: true
- tapOn: "Continue as Guest"
- extendedWaitUntil:
    visible: "Scan"
    timeout: 15000
- tapOn: "Scan"
- tapOn: "Allow Camera"
# Android's runtime permission dialog is separate from the app's permission
# button. `optional` keeps this compatible with an AVD that retained a grant.
- tapOn:
    text: "While using the app"
    optional: true
- extendedWaitUntil:
    visible: "Align barcode within the frame"
    timeout: 10000
# Headless AVDs cannot receive camera frames from Maestro. The debug build's
# fixture button invokes the same expo-camera callback deterministically.
- tapOn: "Use test barcode"
# Keep this assertion after the barcode callback. It proves that a valid code
# was accepted and that the scan handler navigated to the product route.
- extendedWaitUntil:
    visible: "Product"
    timeout: 30000
