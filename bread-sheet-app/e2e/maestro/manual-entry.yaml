# TICKET-P9-003 — manual barcode entry flow (debug build, Android emulator).
#
# The camera-free path (CLAUDE.md's camera-free principle): the scan tab's
# "Enter code manually" sheet must work without the camera at all, and it lands
# on the same /(app)/product/gtin/<barcode> destination a scan produces. This flow
# exercises that path end-to-end on a debug build.
#
# Prereqs: same as barcode-scan.yaml — see scripts/test-maestro.js.
appId: com.breadsheetexpo.breadsheet
---
# Per-flow clean slate — see the note in barcode-scan.yaml. This flow needs no
# camera at all, which is the point of the path it covers.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Continue as Guest"
    timeout: 60000
- tapOn: "Continue as Guest"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 20000
- tapOn: "Scan"
- extendedWaitUntil:
    visible:
      id: "scan-manual-entry"
    timeout: 20000
- tapOn:
    id: "scan-manual-entry"
- extendedWaitUntil:
    visible:
      id: "manual-barcode-input"
    timeout: 10000
# The field autoFocuses, but tap it anyway so inputText cannot land nowhere.
- tapOn:
    id: "manual-barcode-input"
- inputText: "4006381333931"
# Submit with the keyboard's Go action rather than tapping the button.
#
# The button sits below the input, so an open IME pushes it off-screen — and an off-screen
# Android view is absent from the hierarchy entirely, not merely covered, so Maestro reports
# "Element not found: manual-barcode-submit". The obvious remedy, `hideKeyboard`, is worse:
# on Android it is a back press, and this sheet is a <Modal onRequestClose={onClose}>, so
# where no soft IME is up the back press dismisses the sheet instead. That is exactly what
# happened on the CI emulator (no soft IME) while passing locally (Gboard up) — the flow's
# behaviour depended on emulator keyboard configuration.
#
# The field sets returnKeyType="go" with onSubmitEditing={handleSubmit}, so Enter is a real
# user action and is independent of IME state. The button itself stays covered by seven jest
# tests (components/manual-barcode-sheet.test.tsx and the three screens that mount the sheet).
- pressKey: Enter
# Same falsifiable landing assertion as barcode-scan.yaml — and here it matters
# most: "4006381333931" is this very sheet's placeholder, so if inputText never
# reached the field, submit would show a validation error and the number would
# still be on screen. A text assertion would pass without ever navigating.
- extendedWaitUntil:
    visible:
      id: ".*product-(screen|not-found|offline|error).*"
    timeout: 30000
- assertNotVisible:
    id: ".*manual-barcode-input.*"
# Maestro resolves this inside its own per-run output directory
# (~/.maestro/tests/<run>/manual-entry/takeScreenshot/), NOT the repo — a repo-relative
# path here just recreates that tree in there. Bare name on purpose.
- takeScreenshot: manual-entry
