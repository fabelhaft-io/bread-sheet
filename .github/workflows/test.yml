name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    name: Server unit & integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  app:
    name: App unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bread-sheet-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bread-sheet-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  e2e:
    name: App E2E tests (Playwright, Expo web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bread-sheet-app
    # Requires EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY repo
    # *variables* (Settings > Secrets and variables > Actions > Variables — not Secrets:
    # both are EXPO_PUBLIC_* values Expo bakes into the client bundle, so they're already
    # public, same as they are in bread-sheet-app/.env) pointing at a reachable (ideally
    # dedicated test) Supabase project — the specs under e2e/ hit real Supabase auth, same
    # as manual testing. Until those variables are added this job fails loudly rather than
    # silently skipping, per this repo's "fail fast, no inline env defaults" convention
    # (see CLAUDE.md).

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bread-sheet-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: bread-sheet-app/playwright-report/
          retention-days: 14
