name: Native E2E (Maestro)

# Separate from the main Tests workflow on purpose: this job boots an Android emulator and
# runs a Gradle build, so it costs minutes rather than seconds. It runs only when the diff
# touches the camera/scan surface it covers — the same condition the agentic dev team's
# reviewer applies (agent-team/src/prompts/guardrails.md, "Native E2E") — plus on demand.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'bread-sheet-app/app/(tabs)/scan.tsx'
      - 'bread-sheet-app/components/manual-barcode-sheet.tsx'
      - 'bread-sheet-app/features/products/barcode.ts'
      - 'bread-sheet-app/e2e/maestro/**'
      - 'bread-sheet-app/scripts/test-maestro.js'
      - '.github/workflows/test-native-e2e.yml'

permissions:
  contents: read

# An emulator run costs minutes; a rapid second push should supersede the first rather than
# race it. Never cancel on main, where a completed run is what populates the caches below for
# every branch cut from it.
concurrency:
  group: native-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  maestro:
    name: Camera & scan flows on an Android emulator
    # Nested virtualisation for the emulator needs a Linux runner with KVM.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bread-sheet-app

    steps:
      - uses: actions/checkout@v7

      # The flows sign in as a guest against the hosted Supabase project the dev API trusts
      # (SSM /breadsheet/dev/SUPABASE_URL; the repo variables below must name the same
      # project). It is a free-tier project, which Supabase pauses when it sees no traffic.
      # In Nov 2026 that showed up as every guest sign-in timing out. Check it up front, for
      # the same reason as the dev API check below: fail, don't skip, and say why.
      # Restore / rotate runbook: docs/architecture/infrastructure.md § Hosted Supabase project.
      - name: Preflight — is the hosted Supabase project up?
        env:
          SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::EXPO_PUBLIC_SUPABASE_URL repo variable is not set"; exit 1; }
          test -n "$SUPABASE_KEY" || { echo "::error::EXPO_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY repo variable is not set"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 --retry 3 --retry-all-errors \
            -H "apikey: $SUPABASE_KEY" "$SUPABASE_URL/auth/v1/health" || true)
          case "$code" in
            2??) echo "Supabase auth is up (HTTP $code)" ;;
            *)
              echo "::error title=Supabase project unreachable::$SUPABASE_URL/auth/v1/health answered HTTP ${code:-000} (000 = no answer, e.g. DNS). The hosted project is most likely paused — restore it in the Supabase dashboard (docs/architecture/infrastructure.md § Hosted Supabase project) or every guest sign-in will time out."
              exit 1
              ;;
          esac

      # The flows run against the real dev API, which is paused most of the time (Tier 3,
      # dev-auto-teardown.yml). While it is paused, the scan flows fail in ways that look like
      # regressions. Check up front, before ~10 minutes of emulator boot and Gradle build. This
      # FAILS rather than skips on purpose: a skipped E2E suite on a PR reads as a pass.
      - name: Preflight — is the dev API up?
        env:
          API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EDGE_BYPASS: ${{ secrets.EDGE_BYPASS_SECRET }}
        run: |
          test -n "$API_URL" || { echo "::error::EXPO_PUBLIC_API_URL repo variable is not set"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 --retry 3 --retry-all-errors \
            -H "X-Edge-Bypass: $EDGE_BYPASS" "$API_URL/" || true)
          case "$code" in
            2??) echo "dev API is up (HTTP $code)" ;;
            *)
              echo "::error title=dev stack is paused?::$API_URL/ answered HTTP ${code:-000}. The dev stack is most likely paused — resume it (scripts/dev-stack.sh resume) or this run proves nothing."
              exit 1
              ;;
          esac

      # $ANDROID_HOME exists in the runner's shell but NOT in the `env` expression context,
      # where ${{ env.ANDROID_HOME }} silently evaluates to an empty string — which cached
      # "/emulator" and "/system-images/..." at the filesystem root and quietly cached nothing.
      # Publishing it through $GITHUB_ENV puts it in the context the `with:` blocks below read.
      - name: Publish the SDK path into the workflow env
        run: |
          test -n "$ANDROID_HOME" || { echo "ANDROID_HOME is not set on this runner"; exit 1; }
          echo "ANDROID_SDK_PATH=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bread-sheet-app/package-lock.json

      # A JDK in the 17-21 range: the Android Gradle Plugin's JdkImageTransform runs the JDK's
      # own jlink and fails on anything newer, and JDK 24+ additionally breaks the CMake
      # configure tasks via its restricted-native-access rules. scripts/test-maestro.js
      # enforces the same bound and would reject a newer runner default outright.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The emulator package and system image are ~1 GB and the Gradle cache does not cover
      # them, so without this every run re-downloads them. Keyed on the image coordinates: a
      # different API or flavour must miss, since booting the wrong image is exactly the
      # failure this suite hit during development (Play-Store images hang Maestro's inputText).
      #
      # The AVD is deliberately NOT cached; the runner creates a fresh one each run in seconds.
      # Up to -v2, ~/.android/avd rode along (minus its *.qcow2 overlays). Because a cache is
      # saved at job END, the entry held an AVD that had already been booted and used, without
      # the overlays its disk state belonged to. The first run on a cold cache passed. Every
      # run that restored the entry booted into "System UI isn't responding" over the login
      # screen and failed both flows at "Continue as Guest" (PR #200: a fresh AVD passed, the
      # restored one failed twice, with and without the APK cache). Only immutable, downloaded
      # inputs belong in this entry.
      # The -vN suffix moves whenever the path list does: an entry is immutable once written,
      # so a narrowed path list against an unchanged key keeps restoring the old, wider entry
      # and never saves the new one. Expect one slow run after a bump: it re-downloads the
      # emulator and system image.
      - name: Cache Android emulator and system image
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ANDROID_SDK_PATH }}/emulator
            ${{ env.ANDROID_SDK_PATH }}/system-images/android-35/google_apis/x86_64
          key: android-emu-${{ runner.os }}-api35-google_apis-x86_64-v3

      # ubuntu-24.04 ships the SDK, cmdline-tools and platform-tools but NOT the emulator,
      # and no system image — so scripts/test-maestro.js correctly refuses to start. Install
      # the two packages it needs; it provisions the AVD itself from there. `yes |` covers the
      # licence prompts, and sdkmanager writes progress to stdout unconditionally, hence the
      # filtering — a full progress dump is thousands of lines of carriage returns.
      - name: Install Android emulator and system image
        run: |
          set -o pipefail
          IMAGE_DIR="$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
          # Checked on disk rather than on the cache step's hit/miss output: a partial restore
          # should re-download, and scripts/test-maestro.js scans this directory directly, so
          # what matters is whether the files are here — not whether a cache key matched.
          if [ -x "$ANDROID_HOME/emulator/emulator" ] && [ -d "$IMAGE_DIR" ]; then
            echo "emulator and system image restored from cache — skipping download"
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            test -x "$SDKMANAGER" || { echo "sdkmanager not found at $SDKMANAGER"; exit 1; }
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" \
              | grep -viE '^\[=*>? *\]|^$' || true
          fi
          test -x "$ANDROID_HOME/emulator/emulator" || { echo "emulator still missing"; exit 1; }
          test -d "$IMAGE_DIR" || { echo "system image still missing at $IMAGE_DIR"; exit 1; }
          echo "emulator: $("$ANDROID_HOME/emulator/emulator" -version | head -1)"

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # A debug APK does not embed the JS bundle: the app loads it from Metro at launch. So the
      # APK depends only on the native inputs, and a PR that changes only JS, which is nearly
      # every PR that triggers this workflow, can install the APK an earlier run built and skip
      # prebuild + Gradle (~9 of this job's ~13 minutes). @expo/fingerprint hashes exactly those
      # inputs: autolinked native modules and their versions, config plugins, app.json, icons
      # and package.json scripts. It ignores JS-only dependencies, and android/ is gitignored
      # here, so its absence before prebuild doesn't move the hash. The key adds the runner
      # script, which owns the Gradle arguments, and the ABI the AVD below runs. No
      # EXPO_PUBLIC_* value reaches the APK (Metro inlines them into the JS), so a cache entry
      # holds no secret. Bump -v1 to discard every entry.
      - name: Fingerprint the native inputs
        id: native
        run: |
          hash=$(node -e "require('@expo/fingerprint').createFingerprintAsync('.', { platforms: ['android'] }).then((f) => console.log(f.hash))")
          test -n "$hash" || { echo "::error::@expo/fingerprint produced no hash"; exit 1; }
          echo "native fingerprint: $hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore the debug APK for these native inputs
        id: apk
        uses: actions/cache/restore@v6
        with:
          path: .maestro-apk
          key: maestro-apk-${{ runner.os }}-x86_64-${{ steps.native.outputs.hash }}-${{ hashFiles('bread-sheet-app/scripts/test-maestro.js') }}-v1

      # Only a build needs Gradle's caches; on an APK hit this restore and its ~40 s post-save
      # are pure overhead.
      - name: Cache Gradle
        if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bread-sheet-app/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      # The runner provisions its own AVD when cmdline-tools are present, which they are on
      # this image. Supabase config comes from repo *variables*, not secrets: both are
      # EXPO_PUBLIC_* values Expo bakes into the client bundle, so they are already public.
      # Unlike the Playwright job in test.yml, which runs on a local `supabase start` stack,
      # these flows can't use a throwaway Supabase: the dev API verifies every token
      # against its own hosted project, so the app has to sign in to that one.
      - name: Run Maestro flows
        run: npm run test:maestro
        env:
          # Hosted runners are small, so the runner's own heuristic already declines to overlap
          # the Gradle build with the emulator boot here — set explicitly so a larger runner
          # cannot silently re-enable the contention that made the emulator miss adb.
          MAESTRO_OVERLAP_BUILD: '0'
          # A cold boot of a fresh AVD on a 2-vCPU runner is slower than any developer machine;
          # the default 5 minutes is comfortable locally and tight here.
          MAESTRO_BOOT_TIMEOUT_MS: '600000'
          # A hit installs the restored APK and skips the build. A miss builds, and the runner
          # copies the APK out only after Gradle succeeded. Empty means unset to the runner.
          MAESTRO_APK: ${{ steps.apk.outputs.cache-hit == 'true' && format('{0}/.maestro-apk/app-debug.apk', github.workspace) || '' }}
          MAESTRO_APK_OUT: ${{ steps.apk.outputs.cache-hit != 'true' && format('{0}/.maestro-apk/app-debug.apk', github.workspace) || '' }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          # DEV's CloudFront distribution geo-restricts to Germany;
          # GitHub-hosted runners aren't. Sent as X-Edge-Bypass (lib/api.ts), matched
          # by the WAF's "edge-bypass" rule
          EXPO_PUBLIC_EDGE_BYPASS_SECRET: ${{ secrets.EDGE_BYPASS_SECRET }}

      # Saved even when a flow failed: the runner only exports an APK whose build succeeded, and
      # a flaky flow shouldn't throw away a 9-minute build. The file is missing (so nothing is
      # saved) when the build itself failed or the run never reached it.
      - name: Save the debug APK for these native inputs
        if: ${{ !cancelled() && steps.apk.outputs.cache-hit != 'true' && hashFiles('.maestro-apk/app-debug.apk') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .maestro-apk
          key: ${{ steps.apk.outputs.cache-primary-key }}

      # Screenshots and per-step view hierarchies live in Maestro's own run directory, not in
      # the repo — the hierarchy JSON is what distinguishes "view was off-screen" from "wrong
      # testID", which is exactly the failure this suite hit during development.
      - name: Upload Maestro artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: maestro-artifacts
          path: |
            ~/.maestro/tests/
            bread-sheet-app/e2e/maestro/artifacts/
          retention-days: 14
